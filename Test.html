<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MasterHub - Online Test</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">

<style>

body{
background:#f5f7fb;
}

.test-header{
background:#0d6efd;
color:white;
padding:15px 0;
}

.timer{
background:white;
color:#dc3545;
font-weight:bold;
padding:8px 15px;
border-radius:10px;
}

.question-card{
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.option{
display:block;
background:#f8f9fa;
border:1px solid #ddd;
padding:14px;
margin:10px 0;
border-radius:10px;
cursor:pointer;
}

.option:hover{
background:#eaf2ff;
}

.option input{
margin-right:10px;
}

.palette{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.palette button{
width:40px;
height:40px;
margin:4px;
}

</style>

</head>

<body>

<!-- HEADER -->

<header class="test-header">

<div class="container">

<div class="d-flex justify-content-between align-items-center">

<h4 class="mb-0">🎓 MasterHub Test</h4>

<div class="timer">
⏱️ <span id="timer">20:00</span>
</div>

</div>

</div>

</header>


<!-- TEST -->

<div class="container py-4">

<div class="row g-4">


<!-- QUESTION -->

<div class="col-lg-8">

<div class="question-card">

<div class="d-flex justify-content-between">

<h5>
Question <span id="questionNumber">1</span>
</h5>

<span>
<span id="answered">0</span>/<span id="totalQuestions">0</span>
</span>

</div>

<hr>

<h4 id="questionText">
Loading Question...
</h4>

<div id="options"></div>

<div class="d-flex justify-content-between mt-4">

<button
class="btn btn-secondary"
onclick="previousQuestion()">

← Previous

</button>

<button
class="btn btn-primary"
onclick="nextQuestion()">

Next →

</button>

</div>

</div>

</div>


<!-- PALETTE -->

<div class="col-lg-4">

<div class="palette">

<h5>Question Palette</h5>

<hr>

<div id="palette"></div>

</div>

</div>


</div>

</div>


<script src="data/questions.js"></script>


<script>

let currentQuestion = 0;

let userAnswers = [];

let score = 0;

let timeLeft = 20 * 60;


/* TOTAL QUESTIONS */

document.getElementById("totalQuestions").innerText =
questions.length;


/* LOAD QUESTION */

function loadQuestion(){

let q = questions[currentQuestion];

document.getElementById("questionNumber").innerText =
currentQuestion + 1;

document.getElementById("questionText").innerText =
q.question;

let html = "";

q.options.forEach((option,index)=>{

let checked =
userAnswers[currentQuestion] === index
? "checked"
: "";

html += `

<label class="option">

<input
type="radio"
name="answer"
value="${index}"
${checked}>

${option}

</label>

`;

});

document.getElementById("options").innerHTML =
html;

createPalette();

updateAnswered();

}


/* SAVE ANSWER */

function saveAnswer(){

let selected =
document.querySelector(
'input[name="answer"]:checked'
);

if(selected){

userAnswers[currentQuestion] =
Number(selected.value);

}

}


/* NEXT */

function nextQuestion(){

saveAnswer();

if(currentQuestion < questions.length - 1){

currentQuestion++;

loadQuestion();

}else{

submitTest();

}

}


/* PREVIOUS */

function previousQuestion(){

saveAnswer();

if(currentQuestion > 0){

currentQuestion--;

loadQuestion();

}

}


/* QUESTION PALETTE */

function createPalette(){

let html = "";

for(let i=0;i<questions.length;i++){

let cls =
userAnswers[i] !== undefined
? "btn-success"
: "btn-outline-primary";

html += `

<button
class="btn ${cls}"
onclick="goToQuestion(${i})">

${i+1}

</button>

`;

}

document.getElementById("palette").innerHTML =
html;

}


/* GO TO QUESTION */

function goToQuestion(index){

saveAnswer();

currentQuestion = index;

loadQuestion();

}


/* ANSWERED COUNT */

function updateAnswered(){

let count = userAnswers.filter(
answer => answer !== undefined
).length;

document.getElementById("answered").innerText =
count;

}


/* SUBMIT */

function submitTest(){

saveAnswer();

score = 0;

for(let i=0;i<questions.length;i++){

if(userAnswers[i] === questions[i].answer){

score++;

}

}

localStorage.setItem(
"masterhubScore",
score
);

localStorage.setItem(
"masterhubTotal",
questions.length
);

window.location.href =
"result.html";

}


/* TIMER */

function startTimer(){

let timer = setInterval(function(){

let minutes =
Math.floor(timeLeft / 60);

let seconds =
timeLeft % 60;

seconds =
seconds < 10
? "0" + seconds
: seconds;

document.getElementById("timer").innerText =
minutes + ":" + seconds;

if(timeLeft <= 0){

clearInterval(timer);

alert("⏰ समय समाप्त!");

submitTest();

}

timeLeft--;

},1000);

}


/* START */

loadQuestion();

startTimer();

</script>

</body>

    </html>
