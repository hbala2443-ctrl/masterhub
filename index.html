<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterHub</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
}

header{
background:#0d6efd;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.hero{
padding:25px;
text-align:center;
}

.hero h1{
margin:0;
font-size:32px;
}

.hero p{
color:#666;
}

.search{
margin:20px;
text-align:center;
}

.search input{
width:90%;
max-width:500px;
padding:14px;
border-radius:30px;
border:1px solid #ccc;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.1);
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

footer{
background:#0d6efd;
color:white;
padding:15px;
text-align:center;
margin-top:20px;
}
</style>

</head>

<body>

<header>MasterHub</header>

<div class="hero">
<h1>India's Smart Exam Platform</h1>
<p>Practice • Learn • Success</p>
</div>

<div class="search">
<input type="text" placeholder="Search Exam...">
</div>

<div class="grid">

<div class="card">📘 CET Graduation</div>

<div class="card">🎓 CET 12th</div>

<div class="card">👨‍🏫 REET</div>

<div class="card">👮 Police</div>

<div class="card">📝 Patwari</div>

<div class="card">💼 LDC</div>

<div class="card">📚 SSC</div>

<div class="card">🚆 Railway</div>

<div class="card">🏦 Banking</div>

<div class="card">🌍 UPSC</div>

<div class="card">📅 Daily Quiz</div>

<div class="card">🏆 Mock Test</div>

</div>

<footer>
© 2026 MasterHub | Made by Yogesh
</footer>

</body>
  </html>
